<svg xmlns="http://www.w3.org/2000/svg" width="620" height="620" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
<title id="title">Anatomy of a skill file</title><desc id="desc">Six stacked sections in a generated skill file.</desc>
<style>:root{--ink:#183b56;--line:#607080;--blue:#dfeaf3;--panel:#f6f8fa;--amber:#fff4dd;--green:#e8f5ed}@media(prefers-color-scheme:dark){:root{--ink:#e6edf3;--line:#9baabd;--blue:#23364a;--panel:#1f2937;--amber:#4a3610;--green:#183b2a}}text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.box{stroke:var(--line);stroke-width:3;rx:16}.label{font-size:23px;font-weight:700}</style>
<rect class="box" x="120" y="25" width="380" height="70" fill="var(--blue)"/><rect class="box" x="120" y="120" width="380" height="70" fill="var(--panel)"/><rect class="box" x="120" y="215" width="380" height="70" fill="var(--panel)"/><rect class="box" x="120" y="310" width="380" height="70" fill="var(--amber)"/><rect class="box" x="120" y="405" width="380" height="70" fill="var(--amber)"/><rect class="box" x="120" y="500" width="380" height="70" fill="var(--green)"/>
<text class="label" x="310" y="69" text-anchor="middle">Frontmatter</text><text class="label" x="310" y="164" text-anchor="middle">Gather inputs</text><text class="label" x="310" y="259" text-anchor="middle">Method</text><text class="label" x="310" y="354" text-anchor="middle">Guardrails</text><text class="label" x="310" y="449" text-anchor="middle">Stop conditions</text><text class="label" x="310" y="544" text-anchor="middle">Human review</text>
</svg>
